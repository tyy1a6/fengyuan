<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="凤院村小程序码占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07c160"/>
      <stop offset="1" stop-color="#05a050"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f9ef"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="240" height="240" rx="24" fill="url(#bg)"/>
  <circle cx="120" cy="104" r="74" fill="url(#ring)"/>
  <!-- 定位角 -->
  <rect x="74" y="58" width="20" height="20" rx="4" fill="#07c160"/>
  <rect x="166" y="58" width="20" height="20" rx="4" fill="#07c160"/>
  <rect x="74" y="130" width="20" height="20" rx="4" fill="#07c160"/>
  <!-- 中心 logo：微信气泡 -->
  <circle cx="120" cy="104" r="30" fill="#07c160"/>
  <circle cx="110" cy="100" r="5" fill="#ffffff"/>
  <circle cx="130" cy="100" r="5" fill="#ffffff"/>
  <path d="M104 114 Q120 122 136 114" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 文案 -->
  <text x="120" y="206" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#ffffff">凤院村小程序码</text>
  <text x="120" y="228" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e9f9ef">微信扫一扫 · 进入小程序（后台可替换）</text>
</svg>
